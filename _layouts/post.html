<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            max-width: 820px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #fff;
        }
        .header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: #222;
        }
        .meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }
        .category {
            display: inline-block;
            background: #007acc;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .tag {
            display: inline-block;
            background: #f0f0f0;
            color: #555;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 2px 4px;
            font-size: 0.85rem;
        }
        .content {
            font-size: 1.05rem;
        }
        .content h2, .content h3 {
            margin: 1.5rem 0 0.8rem;
        }
        .content p {
            margin-bottom: 1rem;
        }
        .content pre {
            background: #f7f7f7;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .content code {
            color: #d83642;
            font-family: Consolas, monospace;
        }
        .content ul, .content ol {
            margin: 1rem 0 1rem 2rem;
        }
        .back-home {
            display: inline-block;
            margin: 2rem 0;
            color: #007acc;
            text-decoration: none;
        }
        .back-home:hover {
            text-decoration: underline;
        }
        .comment-area {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ page.title }}</h1>
        <div class="meta">
            发布时间：{{ page.date | date: "%Y-%m-%d" }}
            {% if page.categories %}
                <span class="category">{{ page.categories }}</span>
            {% endif %}
            {% if page.tags %}
                {% for tag in page.tags %}
                    <span class="tag">{{ tag }}</span>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <!-- 文章正文 -->
    <div class="content">
        {{ content }}
    </div>

    <!-- 返回首页 -->
    <a href="{{ site.url }}" class="back-home">← 返回博客首页</a>

    <!-- Giscus 评论区 【重点：替换成你自己生成的代码】 -->
    <div class="comment-area">
        <h3>评论区</h3>
        <script src="https://giscus.app/client.js"
        data-repo="yangzhaozhou/yangzhaozhou.github.io"
        data-repo-id="R_kgDOSlbnzQ"
        data-category="General"
        data-category-id="DIC_kwDOSlbnzc4C90Hk"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
		</script>
    </div>
</body>
</html>
